[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xuanzang-skill"
version = "2.0.0"
description = "Auditable document evidence restoration, OCR routing, ManualStrict review, and trust-gated publishing workflow."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "xuanzang-skill contributors"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "PyMuPDF>=1.23",
  "python-docx>=1.1",
  "Pillow>=10",
  "PyYAML>=6"
]

[project.optional-dependencies]
ocr = ["paddleocr>=3"]
dev = ["pytest>=8"]

[project.scripts]
xuanzang = "xuanzang.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
